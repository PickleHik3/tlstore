# Builds the catalog's binaries on GitHub and publishes them as release assets, so nothing
# built is ever committed into the repository. Run it from the Actions tab or
# `gh workflow run build.yml -f tools=dawn,btop` (or `tools=all`). What it does:
#
#   plan     scripts/bins-plan.sh turns the tools input into a matrix: one job per tool and
#            processor (aarch64, x86_64), and per launcher edition for the tools whose binary
#            carries an edition's prefix; one job in all for launcher-skills, which is the same
#            on every processor and lands under both processors' asset names
#   build    recipes/cross/build-asset.sh runs the tool's recipe on ubuntu-24.04 (the NDK from
#            sdkmanager, Go and Rust as the runner has them, Node 22 and pnpm for terminal-browser's
#            JavaScript, the edition's Termux sysroot from
#            its own .deb repository, cached) with TL_ARCH set to the job's processor, and
#            uploads the asset under its catalog name, <tool>-<arch>
#   publish  one GitHub Release for the whole build, tag bins-YYYY.MM.DD[-N], marked prerelease
#            so releases/latest keeps meaning the signed store release (release.yml); every
#            asset is attached under its catalog name, plus a SHA256SUMS of them. Then
#            scripts/bins-record.sh moves the rebuilt items to the new tag in
#            scripts/items.tsv, replaces their SHA256SUMS lines, and the result is committed to
#            main as github-actions[bot]. Tools that were not built keep their tag and digest.
#
# Phones only see a rebuilt tool as an update when its catalog version moves: bins-record.sh
# bumps the build number of a `+<commit>.<N>` version on its own (dawn) and names, in the run
# summary, any other item whose bytes changed but whose version did not — bump those by hand
# (docs/maintainer/catalog.md, "Rebuilding a binary"). A store release (release.yml) is what
# puts the new tag and digests into a signed catalog.
#
# It is also a reusable workflow (workflow_call), which is how upstream-watch.yml runs it. Called,
# it takes two inputs more than the dispatch form:
#   ref      the commit to build instead of the caller's; publish then checks it out rather than
#            main, so its own commits (the watch's version bumps) are rebased onto main and land in
#            the same push as the record: a bump reaches main only together with its binary
#   trial    build and upload, publish nothing: the artifacts are named trial-… instead of bins-…,
#            so a trial and a real build can share one run, and the caller tells which tools built
#            by the artifacts present
# and it returns the bins-… tag it published as the output `tag`.
name: build

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Tools to build: all, or a comma list of btop, tl-priv, tuios-cpu, kitten, tuios, sigye, herdr, terminal-browser, fastfetch, dawn, musl-loader, musl-runtime, launcher-skills, phosh"
        required: false
        default: "all"
  workflow_call:
    inputs:
      tools:
        description: "Tools to build: all, or a comma list (as for workflow_dispatch)"
        type: string
        required: false
        default: "all"
      ref:
        description: "Commit to build, landed on main with the record (empty: the caller's commit, recorded on main)"
        type: string
        required: false
        default: ""
      trial:
        description: "Build only: artifacts named trial-…, no release, nothing recorded"
        type: boolean
        required: false
        default: false
    outputs:
      tag:
        description: "The bins-… tag published (empty for a trial)"
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      # An empty ref (the dispatch form) is the commit the run was started on.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      # Every build job checks out this one commit, so a ref that moves mid-run cannot mix sources.
      - id: plan
        run: |
          matrix="$(scripts/bins-plan.sh "${{ inputs.tools }}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build dpkg-dev make patch python3 file

      # build-phosh.sh runs meson on the host: glib's code generators and schema compiler, gettext's
      # msgfmt, wayland-scanner (the sysroot's is a phone binary) and the build machine's glib and
      # wayland .pc files, which meson reads for the tools.
      - name: phosh's build dependencies
        if: matrix.tool == 'phosh'
        run: |
          sudo apt-get install -y -qq meson pkg-config git curl gettext desktop-file-utils \
            libwayland-dev libwayland-bin wayland-protocols libglib2.0-dev libglib2.0-dev-bin libglib2.0-bin

      - name: kitty's build dependencies
        if: matrix.tool == 'kitten'
        # build-kitten.sh runs kitty's own ./dev.sh build, which compiles kitty for the host
        # before kitten can be cross-built, so the host needs kitty's system libraries.
        run: |
          sudo apt-get install -y -qq pkg-config libgl1-mesa-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxkbcommon-x11-dev libx11-xcb-dev libwayland-dev \
            wayland-protocols libdbus-1-dev libfontconfig-dev

      # kitten and tuios need the NDK only on x86_64, where its link goes through the NDK's clang.
      # musl-runtime and launcher-skills are fetched, not built.
      - name: NDK
        if: matrix.tool != 'musl-runtime' && matrix.tool != 'launcher-skills' && ((matrix.tool != 'kitten' && matrix.tool != 'tuios') || matrix.arch == 'x86_64')
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Go
        if: matrix.tool == 'kitten' || matrix.tool == 'tuios'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false

      # sigye, herdr and terminal-browser (its pixel.node and agent-browser) are Rust, built with the
      # NDK. herdr's recipe downloads its own Zig.
      - name: Rust target
        if: matrix.tool == 'sigye' || matrix.tool == 'herdr' || matrix.tool == 'terminal-browser'
        run: |
          rustup update stable
          rustup target add ${{ matrix.arch }}-linux-android

      # terminal-browser's JavaScript is built from our fork as upstream's release builds it: Node 22
      # and the pnpm its package.json names.
      - name: Node
        if: matrix.tool == 'terminal-browser'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: pnpm
        if: matrix.tool == 'terminal-browser'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # The edition's Termux sysroot and the .deb files it came from. The repositories move,
      # so the key rotates monthly; within a month a rebuild extracts from the cached .debs
      # without touching the network.
      - name: Cache the sysroot
        if: matrix.tool == 'fastfetch' || matrix.tool == 'dawn' || matrix.tool == 'phosh'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            work/sysroot-${{ matrix.edition == '-' && 'com.termux' || matrix.edition }}-${{ matrix.arch }}
            work/debs-${{ matrix.edition == '-' && 'com.termux' || matrix.edition }}-${{ matrix.arch }}
          key: sysroot-${{ matrix.tool }}-${{ matrix.edition }}-${{ matrix.arch }}-${{ hashFiles('recipes/cross/termux-sysroot.sh', 'recipes/cross/phosh-deps.txt') }}-${{ steps.month.outputs.month }}

      # kitty's dependency bundle and its generated Go sources: a built kitty is what the
      # generator needs, and that is the slow part of the recipe.
      - name: Cache the kitty tree
        if: matrix.tool == 'kitten'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: work/build-kitten-com.termux-${{ matrix.arch }}/source
          key: kitten-${{ matrix.arch }}-${{ hashFiles('recipes/cross/build-kitten.sh') }}

      - name: Build ${{ matrix.tool }} (${{ matrix.edition }}, ${{ matrix.arch }})
        run: |
          mkdir -p work assets
          TL_WORK="$PWD/work" TL_ASSETS="$PWD/assets" TL_ARCH="${{ matrix.arch }}" \
            recipes/cross/build-asset.sh "${{ matrix.tool }}" "${{ matrix.edition }}"

      # Everything the job put in assets/: its own build, or, for a tool built once for every
      # processor (arch "any", launcher-skills), the same file under each processor's name. A
      # trial's artifacts are named trial-…, outside publish's bins-* pattern.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.trial && 'trial' || 'bins' }}-${{ matrix.tool }}-${{ matrix.edition }}-${{ matrix.arch }}
          path: assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: ${{ !inputs.trial }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # Shares the store release's lane, so the two never race on SHA256SUMS or on pushing main.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # main, or the called form's ref, whose commits then reach main with the record commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || 'main' }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bins-*
          merge-multiple: true
          path: assets

      - name: Tag
        id: tag
        run: |
          base="bins-$(date -u +%Y.%m.%d)"
          tag=$base; n=2
          while git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; do
            tag="$base-$n"; n=$((n + 1))
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"
          ls -l assets

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ needs.plan.outputs.sha }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          (cd assets && sha256sum -- *-aarch64 *-x86_64 > SHA256SUMS)
          {
            echo "Binaries for the tlstore catalog, built by \`.github/workflows/build.yml\` from \`recipes/cross\` at ${BUILT} (tools: ${{ inputs.tools }})."
            echo
            echo "Not a store release — \`tlstore\` installs these by the digest its signed catalog pins; the signed script, catalog and store UI are on the latest non-prerelease. To reproduce a file, run \`TL_ARCH=<arch> recipes/cross/build-asset.sh <tool> [edition]\` at that commit."
            echo
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$tag" --prerelease --target "$BUILT" \
            --title "Binaries $tag" --notes-file notes.md \
            assets/*-aarch64 assets/*-x86_64 assets/SHA256SUMS

      - name: Record in SHA256SUMS and items.tsv, push
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          rm -f assets/SHA256SUMS
          scripts/bins-record.sh "$tag" assets 2> record.err | tee record.out
          cat record.err >&2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS scripts/items.tsv
          git commit -m "Build $tag: ${{ inputs.tools }} as release assets" \
            -m "$(cat record.out)"
          ok=0
          # fetch and rebase rather than pull: the called form's ref is checked out detached.
          for attempt in 1 2 3; do
            if git fetch -q origin main && git rebase FETCH_HEAD && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::could not push the record commit; run 'scripts/bins-record.sh $tag <assets dir>' locally and commit it"
            exit 1
          fi
          {
            echo "### $tag"
            echo '```'
            cat record.out
            echo '```'
            if [ -s record.err ]; then
              echo "#### Needs a hand"
              echo '```'
              cat record.err
              echo '```'
            fi
            echo "Cut a store release (release.yml) to put the new tag and digests into a signed catalog."
          } >> "$GITHUB_STEP_SUMMARY"
