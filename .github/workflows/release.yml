# Cuts a signed tlstore release from GitHub, so publishing needs no laptop:
# run it from the Actions tab (or `gh workflow run release.yml`), optionally
# naming the tag. It does what docs/maintainer/catalog.md's "Cutting a release"
# does by hand:
#
#   test → rebuild tlstore-ui if ui/ changed → release.sh --prepare → sign.sh
#   → release.sh → commit dist/ and SHA256SUMS → tag → push → GitHub Release
#
# and prints the lock block for the launcher's app/tlstore.lock in the run
# summary. The GitHub Release <tag> is marked latest and carries dist/ as its
# assets: phones refresh their catalog and update tlstore and tlstore-ui from
# releases/latest/download (engine/tlstore, refresh_catalog and self_update),
# while the launcher's gradle fetch keeps reading dist/ from the tag through raw
# URLs, which is why dist/ is still committed. The catalog's binaries are
# release assets of their own, built by build.yml; run that first when a tool
# changed, so the committed items.tsv and SHA256SUMS already name the new tag.
# Heroes and readmes under hero/ and readme/ are published as committed.
#
# Secrets (Settings › Secrets and variables › Actions):
#   TLSTORE_SIGNING_KEY           the minisign secret key file's contents
#   TLSTORE_SIGNING_KEY_PASSWORD  its password
# Anyone who can run this workflow can publish a catalog phones will trust, so
# keep write access to this repository to yourself.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty: today's date, with -2, -3… if taken)"
        required: false
        default: ""
      publish:
        description: "Commit, tag and push (off: a dry run that stops after signing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main

      - name: Tools
        run: |
          sudo apt-get update -qq
          # The shells ci.yml tests under, so the release runs the same suite CI passed.
          sudo apt-get install -y -qq shellcheck minisign dash busybox mksh

      - name: Tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            base=$(date -u +%Y.%m.%d)
            tag=$base; n=2
            while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do tag="$base-$n"; n=$((n + 1)); done
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Test
        run: bash scripts/test.sh

      - name: Rebuild tlstore-ui if ui/ changed
        run: |
          if scripts/check-dist.sh; then exit 0; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          rustup target add aarch64-linux-android x86_64-linux-android
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" scripts/build-ui.sh --install

      - name: Prepare
        run: scripts/release.sh "${{ steps.tag.outputs.tag }}" --prepare

      - name: Sign
        env:
          KEY: ${{ secrets.TLSTORE_SIGNING_KEY }}
          TLSTORE_SIGNING_KEY_PASSWORD: ${{ secrets.TLSTORE_SIGNING_KEY_PASSWORD }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the TLSTORE_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/tlstore-minisign.key"
          printf '%s\n' "$KEY" > "$key"
          TLSTORE_SIGNING_KEY="$key" bash scripts/sign.sh
          rm -f "$key"

      - name: Finish
        run: scripts/release.sh "${{ steps.tag.outputs.tag }}" | tee "$RUNNER_TEMP/release.out"

      - name: Commit, tag, push
        if: ${{ inputs.publish }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          serial=$(sed -n 's/^#.*serial=\([0-9][0-9]*\).*$/\1/p' dist/catalog.tsv | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS dist
          git commit -m "Release $tag: signed catalog (serial $serial) and script, dist/ in SHA256SUMS"
          git tag "$tag"
          git push origin HEAD:main "refs/tags/$tag"

      # The release phones read: releases/latest/download/<file>. --latest keeps
      # it ahead of the bins-… prereleases build.yml makes.
      - name: GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          serial=$(sed -n 's/^#.*serial=\([0-9][0-9]*\).*$/\1/p' dist/catalog.tsv | head -1)
          version=$(sed -n 's/^TLSTORE_VERSION=//p' dist/tlstore | head -1)
          {
            echo "tlstore $version, catalog serial $serial, signed."
            echo
            echo "Phones take \`tlstore\`, \`tlstore.minisig\`, \`catalog.tsv\`, \`catalog.tsv.minisig\` and \`tlstore-ui-<abi>\` from here (\`releases/latest/download/\`), verified against \`trusted.pub\`. The launcher pins the same files from \`dist/\` at this tag:"
            echo
            echo '```'
            sed -n '/^tag /,$p' "$RUNNER_TEMP/release.out"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --latest --title "tlstore $tag" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/tlstore dist/tlstore.minisig dist/catalog.tsv dist/catalog.tsv.minisig \
            dist/trusted.pub dist/tlstore-ui-arm64-v8a dist/tlstore-ui-x86_64

      - name: Lock block
        run: |
          {
            echo "### app/tlstore.lock"
            echo '```'
            sed -n '/^tag /,$p' "$RUNNER_TEMP/release.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
